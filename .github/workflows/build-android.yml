name: Build Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - run: chmod +x gradlew
      - run: ./gradlew assembleDebug assembleRelease bundleRelease --no-daemon
        env:
          CI: true

      - name: Collect APK and AAB
        run: |
          mkdir -p artifacts/apk artifacts/aab
          find app/build/outputs/apk -name "*.apk" -type f -exec cp {} artifacts/apk/ \;
          find app/build/outputs/bundle -name "*.aab" -type f -exec cp {} artifacts/aab/ \;
          echo "=== APKs ==="
          ls -la artifacts/apk/
          echo "=== AABs ==="
          ls -la artifacts/aab/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: artifacts/apk/

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: artifacts/aab/
